<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggarwal Clinic — OPD System</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <style>
        /* ============================================================
           DESIGN TOKENS
        ============================================================ */
        :root {
            --forest:        #1a3a2a;
            --forest-mid:    #1f4a35;
            --forest-light:  #2e7d32;
            --sage:          #4a7c59;
            --mint:          #a8d5b5;
            --cream:         #f9f6f0;
            --gold:          #c9a84c;
            --gold-light:    #e8c97a;
            --glass-bg:      rgba(255,255,255,0.07);
            --glass-border:  rgba(255,255,255,0.13);
            --card-bg:       #ffffff;
            --card-shadow:   0 2px 16px rgba(26,58,42,0.09);
            --text-dark:     #1a2e22;
            --text-mid:      #3d5a45;
            --text-muted:    #7a9a82;
            --bg-page:       #eef4f0;
            --radius:        12px;
            --radius-lg:     18px;

            --sidebar-w:     240px;
            --topbar-h:      60px;
        }

        /* ============================================================
           RESET
        ============================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-page);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            background-image:
                radial-gradient(ellipse at 85% 5%,  rgba(46,125,50,0.07)  0%, transparent 50%),
                radial-gradient(ellipse at 5%  95%,  rgba(201,168,76,0.05) 0%, transparent 50%);
        }

        /* ============================================================
           SIDEBAR
        ============================================================ */
        .sidebar {
            width: var(--sidebar-w);
            min-height: 100vh;
            background: linear-gradient(175deg, var(--forest) 0%, #122b1e 100%);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 200;
            box-shadow: 4px 0 24px rgba(0,0,0,0.18);
            transition: transform 0.3s cubic-bezier(.4,0,.2,1);
        }

        /* ── Brand ── */
        .sidebar-brand {
            padding: 28px 22px 22px;
            border-bottom: 1px solid var(--glass-border);
        }

        .brand-crest {
            width: 46px; height: 46px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 14px rgba(201,168,76,0.35);
            margin-bottom: 14px;
        }

        .brand-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
            letter-spacing: 0.3px;
        }

        .brand-sub {
            font-size: 10.5px;
            color: var(--mint);
            letter-spacing: 1.6px;
            text-transform: uppercase;
            margin-top: 3px;
            opacity: 0.8;
        }

        /* ── Nav section label ── */
        .nav-section-label {
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(168, 213, 181, 0.45);
            padding: 18px 22px 7px;
        }

        /* ── Nav links ── */
        .sidebar-nav {
            flex: 1;
            padding: 10px 12px;
            overflow-y: auto;
        }

        .sidebar-nav::-webkit-scrollbar { display: none; }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 12px;
            border-radius: 9px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            letter-spacing: 0.15px;
            transition: all 0.18s ease;
            position: relative;
            margin-bottom: 2px;
        }

        .nav-link svg {
            width: 16px; height: 16px;
            stroke-width: 2;
            flex-shrink: 0;
            opacity: 0.8;
        }

        .nav-link:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.09);
        }

        .nav-link:hover svg { opacity: 1; }

        .nav-link.active {
            color: #ffffff;
            background: linear-gradient(135deg, rgba(46,125,50,0.55), rgba(46,125,50,0.25));
            box-shadow: inset 0 0 0 1px rgba(168,213,181,0.2);
        }

        .nav-link.active svg { opacity: 1; }

        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0; top: 20%; bottom: 20%;
            width: 3px;
            background: var(--gold);
            border-radius: 0 3px 3px 0;
        }

        .nav-link .badge {
            margin-left: auto;
            background: var(--gold);
            color: var(--forest);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
        }

        /* ── Sidebar footer ── */
        .sidebar-footer {
            padding: 16px 12px;
            border-top: 1px solid var(--glass-border);
        }

        .sidebar-footer .nav-link {
            color: rgba(255,255,255,0.45);
        }

        .sidebar-footer .nav-link:hover {
            color: #ff8a80;
            background: rgba(255,82,82,0.1);
        }

        /* ============================================================
           TOPBAR
        ============================================================ */
        .topbar {
            position: fixed;
            top: 0;
            left: var(--sidebar-w);
            right: 0;
            height: var(--topbar-h);
            background: rgba(238,244,240,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(46,125,50,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Hamburger — mobile only */
        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--forest);
            padding: 4px;
        }

        .topbar-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--forest);
            letter-spacing: 0.2px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar-chip {
            background: rgba(46,125,50,0.1);
            color: var(--forest-mid);
            font-size: 12px;
            font-weight: 600;
            padding: 5px 13px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            border: 1px solid rgba(46,125,50,0.15);
        }

        .topbar-avatar {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, var(--forest-light), var(--forest));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(46,125,50,0.3);
        }

        /* ============================================================
           MAIN CONTENT
        ============================================================ */
        .page-wrapper {
            margin-left: var(--sidebar-w);
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1160px;
            width: 100%;
            margin: 0 auto;
            padding: calc(var(--topbar-h) + 28px) 28px 56px;
        }

        /* ============================================================
           CARDS
        ============================================================ */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px 26px;
            margin-bottom: 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(46,125,50,0.07);
            animation: fadeUp 0.38s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--forest);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--bg-page);
        }

        h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 19px;
            font-weight: 600;
            color: var(--forest);
            margin-bottom: 12px;
        }

        /* ============================================================
           STAT CARDS
        ============================================================ */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 18px;
            text-align: center;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(46,125,50,0.07);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: fadeUp 0.38s ease both;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--forest-light), var(--gold));
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(26,58,42,0.14);
        }

        .stat-card h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 34px;
            font-weight: 700;
            color: var(--forest);
            margin: 4px 0 6px;
            line-height: 1;
            border: none;
            padding: 0;
        }

        .stat-card p {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        /* stats-row (inline variant) */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin: 12px 0 20px;
        }

        .stat-card .label {
            font-size: 10.5px;
            color: var(--text-muted);
            display: block;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-card .value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 700;
            display: block;
            margin-top: 4px;
        }

        .value.green { color: var(--forest-light); }
        .value.blue  { color: #1565c0; }
        .value.red   { color: #c62828; }
        .value.dark  { color: var(--text-dark); }

        /* ============================================================
           CHARTS
        ============================================================ */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        canvas { height: 260px !important; }

        /* ============================================================
           TABLE
        ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 10px;
            border-radius: 10px;
        }

        .opd-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }

        .opd-table thead {
            background: linear-gradient(90deg, #e8f5e9, #f0f9f1);
            position: sticky;
            top: 0;
        }

        .opd-table th {
            padding: 12px 13px;
            text-align: left;
            font-weight: 700;
            font-size: 11px;
            color: var(--forest-mid);
            border-bottom: 2px solid #c8e6c9;
            white-space: nowrap;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .opd-table td {
            padding: 11px 13px;
            border-bottom: 1px solid #f0f4f1;
            vertical-align: middle;
            color: var(--text-dark);
        }

        .opd-table tr:last-child td { border-bottom: none; }

        .opd-table tr:hover td { background: #f5fcf6; }

        .opd-table td, .opd-table th { text-align: center; }
        .opd-table th:first-child,
        .opd-table td:first-child { text-align: left; }

        /* ============================================================
           BADGES
        ============================================================ */
        .pid {
            background: linear-gradient(135deg, #e0f2f1, #c8ece9);
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11.5px;
            color: #00695c;
            letter-spacing: 0.3px;
        }

        .tag {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            background: #e8f5e9;
            color: var(--forest-light);
        }

        .tag.green { background: #e8f5e9; color: var(--forest-light); }
        .tag.orange { background: #fff3e0; color: #e65100; }

        .time   { font-weight: 600; white-space: nowrap; color: var(--text-mid); }
        .name   { font-weight: 600; color: var(--text-dark); }
        .address {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
            font-size: 13px;
        }

        .credit  { color: #c62828; font-weight: 600; }
        .paid    { color: var(--forest-light); font-weight: 600; }
        .neutral { color: var(--text-muted); }
        .voided  { opacity: 0.4; text-decoration: line-through; }

        /* ============================================================
           BUTTONS
        ============================================================ */
        .btn {
            background: linear-gradient(135deg, var(--forest-light), var(--forest));
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 13.5px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.2px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(46,125,50,0.28);
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 16px rgba(46,125,50,0.38);
        }

        .btn:active { transform: translateY(0); }

        .btn-secondary {
            background: linear-gradient(135deg, #546e7a, #37474f);
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
        }

        .btn-secondary:hover { box-shadow: 0 5px 16px rgba(0,0,0,0.25); }

        .btn-warning {
            background: linear-gradient(135deg, #f57c00, #e65100);
            box-shadow: 0 2px 8px rgba(245,124,0,0.3);
        }

        .btn-sm { padding: 6px 13px; font-size: 12px; }

        .btn-link {
            background: linear-gradient(135deg, var(--forest-light), var(--forest));
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-block;
            box-shadow: 0 2px 6px rgba(46,125,50,0.22);
        }

        .btn-link:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(46,125,50,0.32);
        }

        /* ============================================================
           FORMS
        ============================================================ */
        label {
            font-weight: 600;
            font-size: 11.5px;
            margin-top: 14px;
            display: block;
            color: var(--text-mid);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 13px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            border: 1.5px solid #d4e4d8;
            border-radius: 8px;
            box-sizing: border-box;
            background: #fafdfb;
            color: var(--text-dark);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            margin-top: 5px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--forest-light);
            box-shadow: 0 0 0 3px rgba(46,125,50,0.11);
            background: #ffffff;
        }

        input[type="number"] { text-align: center; }

        input[type="radio"] {
            width: auto !important;
            height: auto !important;
            accent-color: var(--forest-light);
            margin-top: 0 !important;
        }

        input[type="date"] { cursor: pointer; }

        /* Gender pill group */
        .gender-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .gender-option {
            flex: 1;
            display: flex !important;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 0;
            border: 1.5px solid #d4e4d8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-mid);
            margin: 0 !important;
            text-transform: none;
            letter-spacing: 0;
            transition: all 0.15s ease;
            background: #fafdfb;
        }

        .gender-option:has(input:checked) {
            border-color: var(--forest-light);
            background: #e8f5e9;
            color: var(--forest);
        }

        .gender-option input { display: none; }

        /* Date filter */
        .date-form {
            display: flex;
            gap: 14px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .date-group { display: flex; flex-direction: column; }

        .compact-input {
            height: 40px;
            font-size: 14px;
            padding: 6px 10px;
        }

        /* Payment mode */
        .payment-modes, .payment-mode-box {
            display: flex;
            align-items: center;
            gap: 28px;
            margin-top: 8px;
        }

        .payment-modes label, .payment-mode-box label {
            display: flex !important;
            align-items: center;
            gap: 7px;
            width: auto !important;
            margin: 0 !important;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            text-transform: none;
            letter-spacing: 0;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        /* section label */
        .section-label {
            font-weight: 600;
            font-size: 11.5px;
            color: var(--text-mid);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 14px;
            display: block;
        }

        /* ============================================================
           PAGINATION
        ============================================================ */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
        }

        .page-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--forest-light), var(--forest));
            color: white;
            border-radius: 7px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(46,125,50,0.25);
        }

        .page-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(46,125,50,0.35);
        }

        .page-info { font-weight: 600; color: var(--text-mid); font-size: 14px; }

        /* ============================================================
           MISC
        ============================================================ */
        .muted { color: var(--text-muted); font-size: 13px; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            font-weight: 600;
            font-size: 13px;
            color: var(--forest-light);
            text-decoration: none;
            transition: color 0.18s;
        }

        .back-link:hover { color: var(--forest); }

        /* Alert variants */
        .alert-warning {
            background: #fff8e1;
            border-left: 4px solid var(--gold);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 16px;
            font-size: 13.5px;
        }

        /* ============================================================
           SIDEBAR OVERLAY (mobile)
        ============================================================ */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 199;
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(calc(-1 * var(--sidebar-w)));
            }

            .sidebar.open { transform: translateX(0); }

            .sidebar-overlay.open { display: block; }

            .page-wrapper { margin-left: 0; }

            .topbar { left: 0; }

            .hamburger { display: flex; }

            .chart-grid    { grid-template-columns: 1fr; }
            .card-grid     { grid-template-columns: 1fr 1fr; }
            .container     { padding: calc(var(--topbar-h) + 16px) 16px 40px; }
        }

        @media (max-width: 560px) {
            .card-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

     SIDEBAR

        </a>

        </a>

        </a>

        <a href="/patient_directory" class="nav-link" data-path="/patient_directory">

        </a>

</aside>

<!-- Mobile overlay -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- ============================================================
     PAGE WRAPPER
============================================================ -->
<div class="page-wrapper">

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="topbar-left">
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <i data-lucide="menu"></i>
            </button>
            <div class="topbar-title" id="topbar-title">OPD System</div>
        </div>
        <div class="topbar-right">
            <span class="topbar-chip">✦ OPD System</span>
            <div class="topbar-avatar">VA</div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

</div>

<!-- ============================================================
     SCRIPTS
============================================================ -->
<script>
    // ── Lucide icons
    lucide.createIcons();

    // ── Active nav link detection
    const currentPath = window.location.pathname;
    document.querySelectorAll('.nav-link[data-path]').forEach(link => {
        const path = link.getAttribute('data-path');
        if (path === '/' ? currentPath === '/' : currentPath.startsWith(path)) {
            link.classList.add('active');
        }
    });

    // ── Topbar title from active link
    const activeLink = document.querySelector('.nav-link.active');
    if (activeLink) {
        document.getElementById('topbar-title').textContent =
            activeLink.textContent.trim();
    }

    // ── Mobile sidebar toggle
    const sidebar  = document.getElementById('sidebar');
    const overlay  = document.getElementById('sidebar-overlay');
    const hamburger = document.getElementById('hamburger');

    function openSidebar() {
        sidebar.classList.add('open');
        overlay.classList.add('open');
    }

    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
    }

    hamburger.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);
</script>

</body>
</html>
